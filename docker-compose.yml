version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: food-delivery-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food-delivery-backend
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/food-del
      - PORT=4000
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=SANDIP_CRAZY_007
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:4000
    container_name: food-delivery-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:4000
    container_name: food-delivery-admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
