{{- if and .Values.backend.enabled .Values.backend.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backend.serviceAccount.name }}
  labels:
    app.kubernetes.io/component: backend
    {{- include "food-delivery.labels" . | nindent 4 }}
  {{- if .Values.backend.serviceAccount.irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.backend.serviceAccount.irsaRoleArn | quote }}
  {{- end }}
{{- end }}
